<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Entrar – Sorriso Pleno</title>
    <link rel="icon" href="assets/image/logo_sorriso_pleno.jpg" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <div class="login">
      <section class="login-marca">
        <div class="logo-img">
          <img src="assets/image/logo_sorriso_pleno.jpg" alt="Sorriso Pleno" />
        </div>
        <p>Agenda, pacientes e prontuários do consultório em um só lugar.</p>
      </section>
      <section class="login-form">
        <form id="f" novalidate>
          <h1>Entrar</h1>
          <label
            >E-mail<input
              id="u"
              type="email"
              autocomplete="email"
              placeholder="Seu e-mail"
          /></label>
          <label
            >Senha<input
              id="s"
              type="password"
              autocomplete="current-password"
              placeholder="Sua senha"
          /></label>
          <span class="erro" id="e" role="alert"
            >Informe usuário e senha para entrar.</span
          >
          <button class="btn" type="submit">Entrar</button>
        </form>
      </section>
    </div>
    <script src="assets/js/common.js"></script>
    <script src="assets/js/login.js"></script>
    <script src="assets/js/api.js"></script>
  </body>
</html>
